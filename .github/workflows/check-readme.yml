name: Check README
on:
  pull_request:
    branches: [ main ]
jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README exists and is non-empty
        run: |
          if [ ! -s README.md ]; then
            echo "README.md is missing or empty!"
            exit 1
          fi
          echo "README.md check passed."
